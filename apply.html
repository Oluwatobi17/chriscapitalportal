		<div class="apply_form">
			<h2>Apply Now!</h2>

			<form id="job-application-form">
				<div>	
					<label>First Name</label>
					<input type="text" name="first_name" id="firstName" required>
				</div>

					<label>Last Name</label>
					<input type="text" name="last_name" id="lastName" required>

					</div>

						<label>Confirm Email</label>
						<input type="email" name="confirm_email" id="confirm_email" required>
					</div>
				</div>

				<div>	
					<label>Age</label>
					<input type="number" name="age" id="age" min="18" required>
				</div>

				<div>	
					<label>Phone Number</label>
					<input type="text" name="Phone Number" id="phone" required>
				</div>

				<div class="split_input">
					<div>	
						<label>Address</label>
						<input type="text" name="address" id="address" required>
					</div>
					<div>	
						<label>Zip code</label>
						<input type="number" name="zipcode" id="zipcode" required>
					</div>
				</div>
				<div>	
					<label>State</label>
					<input type="text" name="state" id="state" required>
				</div>
